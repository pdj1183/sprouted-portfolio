<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    :root { --fill: #000000; }
    @media (prefers-color-scheme: dark) {
      :root { --fill: #ffffff; }
    }
    .sprout { fill: var(--fill); }
    .stem   { stroke: var(--fill); }
  </style>

  <!-- Stem -->
  <path class="stem" d="M50 88 C50 74 48 62 50 44" stroke-width="3.5" stroke-linecap="round" fill="none"/>

  <!-- Left leaf -->
  <path class="sprout" d="M49 64 C46 62 28 56 24 44 C32 38 47 52 50 60 Z"/>

  <!-- Right leaf -->
  <path class="sprout" d="M50 54 C58 50 74 50 78 42 C70 36 56 42 50 50 Z"/>
</svg>
