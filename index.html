  <!-- ============================================
       Google Fonts - Syne (body/nav)
       ============================================ -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<body>

  <!-- ============================================
       NAVIGATION
       Minimal fixed nav — logo left, links right
       ============================================ -->
  <nav class="navbar" id="navbar">
    <div class="nav-container">
      <a href="#hero" class="nav-logo">Sprouted</a>

      <!-- Mobile hamburger button -->
      <button class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation">
        <span class="hamburger"></span>
      </button>

      <ul class="nav-links" id="nav-links">
        <li><a href="#about">About</a></li>
        <li><a href="#connect">Connect</a></li>
        <li><a href="#gallery">Gallery</a></li>
        <li><a href="#shows">Shows</a></li>
      </ul>
    </div>
  </nav>

  <!-- ============================================
       HERO SECTION
       Full-viewport photo background with Ken Burns
       animation and layered gradient overlay
       ============================================ -->
  <section class="hero" id="hero">
    <!-- Background photo — Ken Burns slow zoom -->
    <div class="hero-photo" aria-hidden="true"></div>

    <!-- Layered overlay: color tint + bottom fade for text legibility -->
    <div class="hero-overlay" aria-hidden="true"></div>

    <div class="hero-content">
      <p class="hero-super">DJ &middot; Producer &middot; Curator</p>
      <h1 class="hero-title">SPROUTED</h1>
      <div class="hero-bottom">
        <span class="hero-line-accent" aria-hidden="true"></span>
        <p class="hero-tagline">Fresh energy, every set</p>
        <span class="hero-line-accent" aria-hidden="true"></span>
      </div>
      <a href="#connect" class="hero-cta">Explore</a>
    </div>

    <!-- Scroll indicator -->
    <div class="scroll-indicator" aria-hidden="true">
      <span></span>
    </div>
  </section>

  <!-- ============================================
       ABOUT SECTION
       Asymmetric layout — large pull-quote style
       UPDATE: Replace placeholder text with real bio
       ============================================ -->
  <section class="about" id="about">
    <div class="container">
      <div class="about-layout">
        <div class="about-label fade-in">
          <span class="label-text">About</span>
          <span class="label-line" aria-hidden="true"></span>
        </div>
        <div class="about-content fade-in" id="about-content">
          <!-- Loaded from content.json -->
        </div>
      </div>
    </div>
  </section>

       ============================================ -->
  <section class="connect" id="connect">
    <div class="container">
      <div class="connect-header fade-in">
        <span class="label-text">Connect</span>
        <span class="label-line" aria-hidden="true"></span>
      </div>
      <div class="social-links fade-in">
        <a href="https://www.instagram.com/sprouted.wav/" class="social-link" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
          <i class="fab fa-instagram"></i>

        <a href="https://open.spotify.com/artist/4QMm6CEPl2YcZuNPsOyFKK" class="social-link" target="_blank" rel="noopener noreferrer" aria-label="Spotify">
          <i class="fab fa-spotify"></i>
          <span class="social-name">Spotify</span>
        </a>
        <a href="https://music.apple.com/us/artist/sprouted/1806417380" class="social-link" target="_blank" rel="noopener noreferrer" aria-label="Apple Music">
          <i class="fab fa-apple"></i>

        </a>
        <a href="https://on.soundcloud.com/CdDY82bx5MFRLRWQ7" class="social-link" target="_blank" rel="noopener noreferrer" aria-label="SoundCloud">
          <i class="fab fa-soundcloud"></i>
          <span class="social-name">SoundCloud</span>
        </a>
        <a href="https://www.youtube.com/@Sprouted_wav" class="social-link" target="_blank" rel="noopener noreferrer" aria-label="YouTube">
          <i class="fab fa-youtube"></i>
          <span class="social-name">YouTube</span>
        </a>
        <a href="https://sprouted.bandcamp.com/follow_me" class="social-link" target="_blank" rel="noopener noreferrer" aria-label="Bandcamp">
          <i class="fab fa-bandcamp"></i>
          <span class="social-name">Bandcamp</span>
        </a>
        <a href="https://linktr.ee/sprouted.wav?utm_source=linktree_admin_share&utm_medium=social&utm_content=link_in_bio" class="social-link" target="_blank" rel="noopener noreferrer" aria-label="Linktree">
          <i class="fas fa-link"></i>
          <span class="social-name">Linktree</span>

       SHOWS TIMELINE
